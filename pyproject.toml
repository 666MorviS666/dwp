[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dwp"
version = "0.1.0"
description = "Вероятность победы в Dota 2: модель по драфту и модель по состоянию на поле поминутно"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "requests>=2.28",
]

[project.optional-dependencies]
# Нужен только разделу 8 в dwp.test_web_snapshot: без него синтаксис
# страницы не проверяется, и тест об этом честно пишет.
dev = ["esprima>=4.0"]

[project.scripts]
dwp = "dwp.tui:main"
dwp-web = "dwp.web:main"

[tool.setuptools]
packages = ["dwp"]

# ВАЖНО про установку. `dwp/config.py` считает корень проекта как
# `Path(__file__).parent.parent`, то есть ждёт, что рядом лежат `data/` и
# `models/`. При обычной `pip install .` пакет уезжает в site-packages, и
# корень указывает не туда. Поэтому:
#   • для работы — запускайте из клона (`python -m dwp.web`) либо
#     `pip install -e .`, тогда путь остаётся прежним;
#   • для нестандартного размещения — задайте переменную DWP_HOME, она
#     переопределяет корень целиком (см. `config.ROOT`).
